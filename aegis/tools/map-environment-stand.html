<!doctype html><meta charset="utf-8"><title>AEGIS environment test stand</title><style>body{margin:0;background:#111;color:#eee;font:16px system-ui}#stage{position:fixed;top:12px;left:12px;z-index:1}</style><div id="stage">Starting</div>
<script src="../js/lib/three.min.js"></script><script>
const id=new URLSearchParams(location.search).get('map')||'angar_map';const s=document.createElement('script');s.src='../js/maps/'+id+'.js';document.body.append(s);
s.onload=async()=>{try{const T=THREE; const renderer=new T.WebGLRenderer({antialias:false});renderer.setSize(960,540);renderer.shadowMap.enabled=false;document.body.appendChild(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#a4adb5');scene.fog=new T.FogExp2('#a4adb5',.002);scene.add(new T.HemisphereLight(0xbfd4e5,0x5d584c,2));const light=new T.DirectionalLight(0xffe9ca,3);light.position.set(60,100,20);scene.add(light);const camera=new T.PerspectiveCamera(70,960/540,.08,1200);camera.position.set(-25,6,-20);camera.lookAt(0,1,0);let marks=[];const env=await AEGIS_MAP_BUILDERS[id]({THREE:T,renderer,scene,camera,BGU:THREE_ADDONS['utils/BufferGeometryUtils.js'],quality:new URLSearchParams(location.search).get('q')||'low',stage:async name=>{document.querySelector('#stage').textContent=name;marks.push(name);await new Promise(r=>setTimeout(r,0))}});window.ENV={env,scene,camera,renderer,marks};let b=env.bases.alpha;camera.position.set(b.x,env.heightAt(b.x,b.z)+2,b.z);camera.lookAt(0,1,0);scene.updateMatrixWorld(true);renderer.render(scene,camera);window.DONE=true;document.querySelector('#stage').textContent=id+' READY '+env.native.length+' colliders';}catch(e){window.FAIL=e.stack;document.querySelector('#stage').textContent=e.stack;console.error(e)}};
</script>
